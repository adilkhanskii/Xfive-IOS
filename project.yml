name: X5
options:
  bundleIdPrefix: com.x5studio
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"
  TUSKit:
    url: https://github.com/tooyakov-art/TUSKit.git
    revision: "4fd278f37b8a20f826a6fa45ae12b18b47b058b6"
  NextLevelSessionExporter:
    url: https://github.com/NextLevel/NextLevelSessionExporter.git
    revision: "1bb6e19731ff512f4652f8ce2a8f67c779b1598f"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: F8LA8PC4U6
    MARKETING_VERSION: "1.1.12"
    CURRENT_PROJECT_VERSION: "249"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  X5:
    type: application
    platform: iOS
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: TUSKit
        product: TUSKit
      - package: NextLevelSessionExporter
        product: NextLevelSessionExporter
    sources:
      - path: X5
    resources:
      - path: X5/Assets.xcassets
      - path: X5/en.lproj
      - path: X5/ru.lproj
      - path: X5/kk.lproj
      - path: X5/PrivacyInfo.xcprivacy
      - path: X5/Resources/ThirdParty
      - path: X5/Resources/HomeMotion
      - path: X5/Resources/cis-cities.json
    info:
      path: X5/Info.plist
      properties:
        CFBundleDisplayName: Xfive marketing
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - ru
          - kk
        CFBundleURLTypes:
          - CFBundleURLName: com.x5studio.app.oauth
            CFBundleURLSchemes:
              - x5
          # Google Sign-In iOS SDK reversed client ID (matches iOS Client ID in GCP)
          - CFBundleURLName: com.googleusercontent.apps.931639129066-ft7bod2n3ugi4cc3j1l68avcqtq3rv2j
            CFBundleURLSchemes:
              - com.googleusercontent.apps.931639129066-ft7bod2n3ugi4cc3j1l68avcqtq3rv2j
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: "Used to lock Xfive marketing — only the device owner can open the app."
        NSMicrophoneUsageDescription: "Microphone access is needed to record voice messages in chats."
        NSPhotoLibraryUsageDescription: "Select photos and videos for courses, chats, portfolio, and AI tools."
        NSPhotoLibraryAddUsageDescription: "Save generated images and videos to your photo library."
        LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: X5/X5.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: production
    configFiles:
      Release: Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.x5studio.app
        PRODUCT_NAME: Xfive marketing
        PRODUCT_MODULE_NAME: X5
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        ENABLE_BITCODE: NO
        SWIFT_OBJC_BRIDGING_HEADER: ""
      configs:
        # Manual signing scoped to the X5 target for Release only вЂ” keeps SPM
        # dependencies (GoogleSignIn / AppAuth / GTMSessionFetcher resource
        # bundles) on Automatic signing where they don't trip on a manual
        # provisioning profile. Profile NAME is injected via Release.xcconfig
        # at CI time (it comes from the secret-encoded mobileprovision).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution

  X5Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: X5Tests
    dependencies:
      - target: X5
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.x5studio.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Xfive marketing.app/Xfive marketing"
        BUNDLE_LOADER: "$(TEST_HOST)"

  X5AcceptanceUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: X5AcceptanceUITests
      # Test runner only. Never include review credentials in the application.
      - path: .secrets/review-test/demo_user.txt
        optional: true
        buildPhase: resources
      - path: .secrets/review-test/demo_password.txt
        optional: true
        buildPhase: resources
    dependencies:
      - target: X5
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.x5studio.app.acceptance-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: X5

schemes:
  X5-Acceptance-CI:
    build:
      targets:
        X5: all
        X5AcceptanceUITests: [test]
    test:
      config: Debug
      targets:
        - name: X5AcceptanceUITests
          parallelizable: false

  X5-Course-CI:
    build:
      targets:
        X5: all
        X5Tests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: X5Tests
          parallelizable: false

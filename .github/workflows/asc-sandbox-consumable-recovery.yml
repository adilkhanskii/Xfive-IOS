name: ASC recover fixed Sandbox consumable

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x5-fixed-sandbox-consumable-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    environment: app-store-production
    timeout-minutes: 10
    env:
      IAP_API_KEY_ID: ${{ secrets.IAP_API_KEY_ID || secrets.ASC_API_KEY_ID }}
      IAP_API_ISSUER_ID: ${{ secrets.IAP_API_ISSUER_ID || secrets.ASC_API_ISSUER_ID }}
      IAP_API_KEY_BASE64: ${{ secrets.IAP_API_KEY_BASE64 || secrets.ASC_API_KEY_BASE64 }}

    steps:
      - name: Check out the audited revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pinned recovery dependencies
        run: python -m pip install --require-hashes -r .github/requirements/asc-requirements.lock

      - name: Verify the fixed recovery contract
        run: python -m unittest scripts.tests.test_apple_sandbox_consumable_recovery

      - name: Recover the fixed Sandbox consumable
        run: python -m scripts.apple_sandbox_consumable_recovery

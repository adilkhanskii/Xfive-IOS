name: ASC finalize pending submission

permissions:
  contents: read

# Submission b977 is in READY_FOR_REVIEW but empty. Try to attach the
# subscription product and submit it as a separate (IAP-only) review.
# If Apple's UNRESOLVED_ISSUES locks the app version, this at least
# pushes the IAP through.
on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: "ReviewSubmission id"
        required: true
        default: "b977a121-7563-4df1-bb60-efbbb3c68916"
      subscription_id:
        description: "Subscription Apple ID"
        required: false
        default: "6765650866"

jobs:
  run:
    runs-on: ubuntu-latest
    environment: app-store-production
    timeout-minutes: 5
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      SUB: ${{ inputs.submission_id }}
      SUB_PID: ${{ inputs.subscription_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r .github/requirements/asc-requirements.lock
      - name: Finalize
        run: |
          python <<'PY'
          import os, base64, time, sys
          import jwt, requests

          token = jwt.encode(
              {"iss": os.environ["ASC_API_ISSUER_ID"], "iat": int(time.time()),
               "exp": int(time.time()) + 300, "aud": "appstoreconnect-v1"},
              base64.b64decode(os.environ["ASC_API_KEY_BASE64"]),
              algorithm="ES256",
              headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"},
          )
          h = {"Authorization": f"Bearer {token}"}
          base = "https://api.appstoreconnect.apple.com/v1"
          SUB = os.environ["SUB"]
          SUB_PID = os.environ["SUB_PID"]

          # Try add app version first (might work now if rejected item was detached).
          BUNDLE = "com.x5studio.app"
          r = requests.get(f"{base}/apps?filter[bundleId]={BUNDLE}", headers=h)
          app_id = r.json()["data"][0]["id"]
          r = requests.get(f"{base}/apps/{app_id}/appStoreVersions", headers=h)
          version_id = next(
              (v["id"] for v in r.json()["data"]
               if v["attributes"]["versionString"] == "1.1.0"),
              None
          )
          print(f"Version 1.1.0: {version_id}")

          r = requests.post(
              f"{base}/reviewSubmissionItems",
              headers={**h, "Content-Type": "application/json"},
              json={"data": {
                  "type": "reviewSubmissionItems",
                  "relationships": {
                      "reviewSubmission": {"data": {"type": "reviewSubmissions", "id": SUB}},
                      "appStoreVersion": {"data": {"type": "appStoreVersions", "id": version_id}},
                  }
              }},
          )
          print(f"Add app version HTTP {r.status_code}: {r.text[:400]}")
          app_added = r.status_code < 300

          # Try add subscription.
          r = requests.post(
              f"{base}/reviewSubmissionItems",
              headers={**h, "Content-Type": "application/json"},
              json={"data": {
                  "type": "reviewSubmissionItems",
                  "relationships": {
                      "reviewSubmission": {"data": {"type": "reviewSubmissions", "id": SUB}},
                      "subscription": {"data": {"type": "subscriptions", "id": SUB_PID}},
                  }
              }},
          )
          print(f"Add subscription HTTP {r.status_code}: {r.text[:400]}")
          sub_added = r.status_code < 300

          if not app_added and not sub_added:
              sys.exit("Both items failed to attach")

          # Submit.
          r = requests.patch(
              f"{base}/reviewSubmissions/{SUB}",
              headers={**h, "Content-Type": "application/json"},
              json={"data": {"type": "reviewSubmissions", "id": SUB,
                             "attributes": {"submitted": True}}},
          )
          print(f"Submit HTTP {r.status_code}: {r.text[:600]}")
          PY

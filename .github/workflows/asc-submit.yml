name: ASC ship (screenshots + submit for review)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        default: "ship"
        type: choice
        options:
          - upload
          - submit_for_review
          - ship
          - reject_pending

jobs:
  ship:
    runs-on: macos-26
    environment: app-store-production
    timeout-minutes: 25
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      X5_APP_REVIEW_EMAIL: ${{ secrets.X5_APP_REVIEW_EMAIL }}
      X5_APP_REVIEW_PASSWORD: ${{ secrets.X5_APP_REVIEW_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check protected review login before metadata changes
        if: inputs.action == 'upload' || inputs.action == 'ship' || inputs.action == ''
        run: python3 scripts/review_test_credentials.py --check

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3.12"
          bundler-cache: true


      - name: Run fastlane
        run: |
          cd "$GITHUB_WORKSPACE"
          bundle exec fastlane ios ${{ inputs.action || 'upload' }}

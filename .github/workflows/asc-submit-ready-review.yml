name: ASC submit existing ready review

on:
  workflow_dispatch:
  push:
    branches: [codex/x5-cleanup-from-restore-clean]
    paths:
      - ".github/workflows/asc-submit-ready-review.yml"

permissions:
  contents: read

jobs:
  add-app-version-item:
    runs-on: ubuntu-latest
    environment: app-store-production
    timeout-minutes: 5
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      BUNDLE_ID: com.x5studio.app
      TARGET_VERSION: "1.1.4"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r .github/requirements/asc-requirements.lock
      - run: |
          python <<'PY'
          import base64
          import os
          import sys
          import time

          import jwt
          import requests

          BASE = "https://api.appstoreconnect.apple.com/v1"
          token = jwt.encode(
              {
                  "iss": os.environ["ASC_API_ISSUER_ID"],
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 600,
                  "aud": "appstoreconnect-v1",
              },
              base64.b64decode(os.environ["ASC_API_KEY_BASE64"]),
              algorithm="ES256",
              headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"},
          )
          h = {"Authorization": f"Bearer {token}"}
          jh = {**h, "Content-Type": "application/json"}

          def get(path):
              response = requests.get(f"{BASE}{path}", headers=h, timeout=60)
              if response.status_code >= 300:
                  print(response.text[:3000])
                  raise SystemExit(1)
              return response.json()

          app_id = get(f"/apps?filter[bundleId]={os.environ['BUNDLE_ID']}")["data"][0]["id"]
          versions = get(f"/apps/{app_id}/appStoreVersions?limit=50")["data"]
          version_id = next(
              v["id"] for v in versions
              if v["attributes"]["versionString"] == os.environ["TARGET_VERSION"]
              and v["attributes"]["platform"] == "IOS"
          )
          submissions = get(f"/reviewSubmissions?filter[app]={app_id}&filter[platform]=IOS")["data"]
          submission_id = next(
              row["id"] for row in submissions
              if row["attributes"].get("state") == "READY_FOR_REVIEW"
          )
          response = requests.post(
              f"{BASE}/reviewSubmissionItems",
              headers=jh,
              json={
                  "data": {
                      "type": "reviewSubmissionItems",
                      "relationships": {
                          "reviewSubmission": {
                              "data": {"type": "reviewSubmissions", "id": submission_id}
                          },
                          "appStoreVersion": {
                              "data": {"type": "appStoreVersions", "id": version_id}
                          },
                      },
                  }
              },
              timeout=60,
          )
          print(f"add_item_status={response.status_code}")
          print(response.text[:3000])
          if response.status_code not in {201, 409}:
              raise SystemExit(1)
          PY

  submit-ready-review:
    needs: add-app-version-item
    runs-on: ubuntu-latest
    environment: app-store-production
    timeout-minutes: 5
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      BUNDLE_ID: com.x5studio.app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r .github/requirements/asc-requirements.lock
      - run: |
          python <<'PY'
          import base64
          import os
          import time
          from pathlib import Path

          import jwt
          import requests

          BASE = "https://api.appstoreconnect.apple.com/v1"
          token = jwt.encode(
              {
                  "iss": os.environ["ASC_API_ISSUER_ID"],
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 600,
                  "aud": "appstoreconnect-v1",
              },
              base64.b64decode(os.environ["ASC_API_KEY_BASE64"]),
              algorithm="ES256",
              headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"},
          )
          h = {"Authorization": f"Bearer {token}"}
          jh = {**h, "Content-Type": "application/json"}

          def get(path):
              response = requests.get(f"{BASE}{path}", headers=h, timeout=60)
              if response.status_code >= 300:
                  print(response.text[:3000])
                  Path("diagnostics").mkdir(exist_ok=True)
                  Path("diagnostics/asc-submit-ready-result.txt").write_text(
                      f"ok=false\nget_error_path={path}\nstatus={response.status_code}\n{response.text[:3000]}\n",
                      encoding="utf-8",
                  )
                  raise SystemExit(0)
              return response.json()

          app_id = get(f"/apps?filter[bundleId]={os.environ['BUNDLE_ID']}")["data"][0]["id"]
          submissions = get(f"/reviewSubmissions?filter[app]={app_id}&filter[platform]=IOS")["data"]
          submission_id = next(
              row["id"] for row in submissions
              if row["attributes"].get("state") == "READY_FOR_REVIEW"
          )
          response = requests.patch(
              f"{BASE}/reviewSubmissions/{submission_id}",
              headers=jh,
              json={
                  "data": {
                      "type": "reviewSubmissions",
                      "id": submission_id,
                      "attributes": {"submitted": True},
                  }
              },
              timeout=60,
          )
          body = response.text[:3000]
          ok = False
          state = ""
          if response.status_code < 300:
              state = response.json()["data"]["attributes"].get("state") or ""
              ok = state in {"WAITING_FOR_REVIEW", "IN_REVIEW", "COMPLETING"}

          Path("diagnostics").mkdir(exist_ok=True)
          Path("diagnostics/asc-submit-ready-result.txt").write_text(
              "\n".join(
                  [
                      f"ok={'true' if ok else 'false'}",
                      f"submission_id={submission_id}",
                      f"submit_status={response.status_code}",
                      f"state={state}",
                      body,
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          PY
      - name: Commit submit diagnostic
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostics/asc-submit-ready-result.txt
          git commit -m "Record ASC submit diagnostic [skip ci]" || true
          git push origin HEAD:codex/x5-cleanup-from-restore-clean || true
      - name: Assert submit completed
        run: grep -q '^ok=true$' diagnostics/asc-submit-ready-result.txt

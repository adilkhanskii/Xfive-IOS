name: ASC release audit

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Audit release/availability, exclude CHN, or set AFTER_APPROVAL"
        required: true
        type: choice
        default: "audit"
        options:
          - audit
          - audit_availability
          - exclude_china
          - set_after_approval
          - audit_payments
      transaction_ids:
        description: "Up to 10 disputed Apple transaction IDs; read-only lookup"
        required: false
        default: ""
  push:
    branches: [codex/x5-kaspi-testflight-20260813]
    paths:
      - ".github/workflows/asc-release-audit.yml"
      - "scripts/asc_app_availability.py"
      - "fastlane/**"
      - "project.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: app-store-production
    timeout-minutes: 8
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      BUNDLE_ID: com.x5studio.app
      EXPECTED_APP_NAME: "Xfive marketing"
      EXPECTED_VERSION: "1.1.12"
      EXPECTED_BUILD: "257"
      EXPECTED_RUNTIME_BUILD: "257"
      AUDIT_SCOPE: "post-submit-app-version-build-screenshots-subscriptions"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r .github/requirements/asc-requirements.lock
      - name: Test read-only payment audit
        if: ${{ inputs.action == 'audit_payments' }}
        run: python -m unittest scripts.tests.test_apple_transaction_audit
      - name: Check disputed purchases directly with Apple
        if: ${{ inputs.action == 'audit_payments' }}
        env:
          TRANSACTION_IDS: ${{ inputs.transaction_ids }}
          IAP_API_KEY_ID: ${{ secrets.IAP_API_KEY_ID || secrets.ASC_API_KEY_ID }}
          IAP_API_ISSUER_ID: ${{ secrets.IAP_API_ISSUER_ID || secrets.ASC_API_ISSUER_ID }}
          IAP_API_KEY_BASE64: ${{ secrets.IAP_API_KEY_BASE64 || secrets.ASC_API_KEY_BASE64 }}
        run: python -m scripts.apple_transaction_audit
      - name: Audit app availability
        if: ${{ inputs.action == 'audit_availability' }}
        run: python scripts/asc_app_availability.py --action audit
      - name: Exclude Mainland China only
        if: ${{ inputs.action == 'exclude_china' }}
        run: >-
          python scripts/asc_app_availability.py
          --action exclude-china
          --confirmation EXCLUDE_CHN_KEEP_OTHER_TERRITORIES
      - name: Set automatic release after approval
        if: ${{ inputs.action == 'set_after_approval' }}
        run: python scripts/asc_set_after_approval.py
      - name: Audit App Store Connect release state
        run: |
          python <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          import time
          from pathlib import Path

          import jwt
          import requests

          BASE = "https://api.appstoreconnect.apple.com/v1"
          EXPECTED_PRODUCTS = {
              "com.x5studio.app.lite.monthly": "X5 Lite Monthly",
              "com.x5studio.app.pro.monthly": "X5 Pro Monthly",
              "com.x5studio.app.max.monthly": "X5 Max Monthly",
              "com.x5studio.app.verified.monthly": "X5 Verified Badge Monthly",
          }
          READY_VERSION_STATES = {
              "PREPARE_FOR_SUBMISSION",
              "DEVELOPER_REJECTED",
              "REJECTED",
              "WAITING_FOR_REVIEW",
              "IN_REVIEW",
              "PENDING_APPLE_RELEASE",
              "PENDING_DEVELOPER_RELEASE",
              "READY_FOR_SALE",
          }
          BLOCKED_SUBSCRIPTION_STATES = {
              "MISSING_METADATA",
              "DEVELOPER_ACTION_NEEDED",
              "REJECTED",
              "REMOVED_FROM_SALE",
          }

          issues = []
          warnings = []

          def issue(msg):
              issues.append(msg)
              print(f"ISSUE: {msg}")

          def warn(msg):
              warnings.append(msg)
              print(f"WARN: {msg}")

          def token():
              return jwt.encode(
                  {
                      "iss": os.environ["ASC_API_ISSUER_ID"],
                      "iat": int(time.time()),
                      "exp": int(time.time()) + 600,
                      "aud": "appstoreconnect-v1",
                  },
                  base64.b64decode(os.environ["ASC_API_KEY_BASE64"]),
                  algorithm="ES256",
                  headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"},
              )

          TOKEN = token()

          def headers(content=False):
              h = {"Authorization": f"Bearer {TOKEN}"}
              if content:
                  h["Content-Type"] = "application/json"
              return h

          def api(method, path, expected=(200,), **kwargs):
              url = path if path.startswith("http") else f"{BASE}{path}"
              response = requests.request(method, url, headers=headers("json" in kwargs), timeout=60, **kwargs)
              if response.status_code not in expected:
                  print(f"{method} {url} -> HTTP {response.status_code}")
                  print(response.text[:3000])
                  raise SystemExit(1)
              return response.json() if response.text else {}

          def maybe(method, path, **kwargs):
              url = path if path.startswith("http") else f"{BASE}{path}"
              response = requests.request(method, url, headers=headers("json" in kwargs), timeout=60, **kwargs)
              print(f"{method} {path} -> HTTP {response.status_code}")
              if response.status_code >= 300:
                  print(response.text[:700])
                  return None
              return response.json() if response.text else {}

          def list_all(path):
              rows = []
              url = f"{BASE}{path}"
              while url:
                  response = requests.get(url, headers=headers(), timeout=60)
                  if response.status_code >= 300:
                      print(f"GET {url} -> HTTP {response.status_code}")
                      print(response.text[:3000])
                      raise SystemExit(1)
                  payload = response.json()
                  rows.extend(payload.get("data", []))
                  url = payload.get("links", {}).get("next")
              return rows

          def try_list_all(path):
              rows = []
              url = f"{BASE}{path}"
              while url:
                  response = requests.get(url, headers=headers(), timeout=60)
                  print(f"GET {url} -> HTTP {response.status_code}")
                  if response.status_code >= 300:
                      print(response.text[:1000])
                      return None
                  payload = response.json()
                  rows.extend(payload.get("data", []))
                  url = payload.get("links", {}).get("next")
              return rows

          def read_text(path):
              p = Path(path)
              return p.read_text(encoding="utf-8").strip() if p.exists() else ""

          project = read_text("project.yml")
          marketing = re.search(r'MARKETING_VERSION:\s*"([^"]+)"', project)
          build = re.search(r'CURRENT_PROJECT_VERSION:\s*"([^"]+)"', project)
          fastfile = read_text("fastlane/Fastfile")
          fast_version = re.search(r'APP_VERSION\s*=\s*"([^"]+)"', fastfile)
          review_notes = read_text("fastlane/metadata/review_information/notes.txt")

          print("=== Local release config ===")
          print(f"project MARKETING_VERSION={marketing.group(1) if marketing else '?'}")
          print(f"project CURRENT_PROJECT_VERSION={build.group(1) if build else '?'}")
          print(f"fastlane APP_VERSION={fast_version.group(1) if fast_version else '?'}")
          if not marketing or marketing.group(1) != os.environ["EXPECTED_VERSION"]:
              issue("project.yml MARKETING_VERSION does not match EXPECTED_VERSION")
          if not build or build.group(1) != os.environ["EXPECTED_RUNTIME_BUILD"]:
              issue("project.yml CURRENT_PROJECT_VERSION does not match EXPECTED_RUNTIME_BUILD")
          if not fast_version or fast_version.group(1) != os.environ["EXPECTED_VERSION"]:
              issue("fastlane APP_VERSION does not match EXPECTED_VERSION")
          if os.environ["EXPECTED_BUILD"] not in review_notes or os.environ["EXPECTED_VERSION"] not in review_notes:
              issue("App Review notes do not mention the expected version/build")

          app_rows = api("GET", f"/apps?filter[bundleId]={os.environ['BUNDLE_ID']}").get("data", [])
          if not app_rows:
              raise SystemExit(f"No ASC app found for {os.environ['BUNDLE_ID']}")
          app = app_rows[0]
          app_id = app["id"]
          print("\n=== App ===")
          print(f"id={app_id} bundle={os.environ['BUNDLE_ID']} attrs={app.get('attributes', {})}")

          print("\n=== App name localizations ===")
          app_infos = list_all(f"/apps/{app_id}/appInfos?limit=50")
          localized_names = {}
          for app_info in app_infos:
              info_attrs = app_info.get("attributes", {})
              print(
                  f"appInfo id={app_info['id']} "
                  f"state={info_attrs.get('appStoreState')}"
              )
              info_localizations = list_all(
                  f"/appInfos/{app_info['id']}/appInfoLocalizations?limit=50"
              )
              for localization in info_localizations:
                  attrs = localization.get("attributes", {})
                  locale = attrs.get("locale")
                  name = attrs.get("name")
                  print(f"  locale={locale} name={name!r}")
                  if locale and name:
                      localized_names.setdefault(locale, set()).add(name)
          expected_name = os.environ["EXPECTED_APP_NAME"]
          if expected_name not in localized_names.get("en-US", set()):
              issue(
                  "App Store en-US name is not the exact expected value: "
                  f"{expected_name!r}"
              )
          if "ru" in localized_names and expected_name not in localized_names["ru"]:
              issue(
                  "App Store ru name is not the exact expected value: "
                  f"{expected_name!r}"
              )

          print("\n=== Builds ===")
          builds = list_all(f"/builds?filter[app]={app_id}&filter[preReleaseVersion.platform]=IOS&limit=200&sort=-uploadedDate")
          target_build = None
          for row in builds[:12]:
              a = row.get("attributes", {})
              print(f"build id={row['id']} version={a.get('version')} state={a.get('processingState')} expired={a.get('expired')} uploaded={a.get('uploadedDate')}")
              if a.get("version") == os.environ["EXPECTED_BUILD"]:
                  target_build = row
          if not target_build:
              issue(f"Build {os.environ['EXPECTED_BUILD']} not found in ASC")
          else:
              attrs = target_build["attributes"]
              if attrs.get("processingState") != "VALID":
                  issue(f"Build {os.environ['EXPECTED_BUILD']} is not VALID: {attrs.get('processingState')}")
              if attrs.get("expired"):
                  issue(f"Build {os.environ['EXPECTED_BUILD']} is expired")
              beta = maybe("GET", f"/builds/{target_build['id']}/buildBetaDetail")
              if beta and beta.get("data"):
                  print(f"buildBetaDetail={beta['data'].get('attributes', {})}")

          print("\n=== App Store versions ===")
          versions = list_all(f"/apps/{app_id}/appStoreVersions?limit=50")
          target_version = None
          for row in versions:
              a = row.get("attributes", {})
              print(f"version id={row['id']} version={a.get('versionString')} platform={a.get('platform')} state={a.get('appStoreState')} releaseType={a.get('releaseType')}")
              if a.get("versionString") == os.environ["EXPECTED_VERSION"] and a.get("platform") == "IOS":
                  target_version = row
          if not target_version:
              issue(f"AppStoreVersion {os.environ['EXPECTED_VERSION']} for iOS does not exist")
              target_version_id = None
          else:
              target_version_id = target_version["id"]
              state = target_version["attributes"].get("appStoreState")
              if state not in READY_VERSION_STATES:
                  issue(f"Version {os.environ['EXPECTED_VERSION']} is not in a releasable/submittable state: {state}")

          if target_version_id:
              print("\n=== Attached binary ===")
              attached = maybe("GET", f"/appStoreVersions/{target_version_id}/build")
              if not attached or not attached.get("data"):
                  issue("No build attached to AppStoreVersion")
              else:
                  a = attached["data"].get("attributes", {})
                  print(f"attached build id={attached['data']['id']} version={a.get('version')} state={a.get('processingState')}")
                  if a.get("version") != os.environ["EXPECTED_BUILD"]:
                      issue(f"Attached build is {a.get('version')}, expected {os.environ['EXPECTED_BUILD']}")

              print("\n=== Version localizations and screenshots ===")
              localizations = list_all(f"/appStoreVersions/{target_version_id}/appStoreVersionLocalizations?limit=20")
              if not localizations:
                  issue("No App Store version localizations")
              for loc in localizations:
                  la = loc.get("attributes", {})
                  print(f"localization {loc['id']} locale={la.get('locale')} whatsNew={bool(la.get('whatsNew'))} descLen={len(la.get('description') or '')} keywordsLen={len(la.get('keywords') or '')}")
                  sets = list_all(f"/appStoreVersionLocalizations/{loc['id']}/appScreenshotSets?limit=50")
                  print(f"  screenshot sets={len(sets)}")
                  if not sets:
                      issue(f"No screenshot sets for locale {la.get('locale')}")
                  for ss in sets:
                      sa = ss.get("attributes", {})
                      shots = list_all(f"/appScreenshotSets/{ss['id']}/appScreenshots?limit=20")
                      print(f"  set {ss['id']} displayType={sa.get('screenshotDisplayType')} screenshots={len(shots)}")
                      if len(shots) < 3:
                          warn(f"Only {len(shots)} screenshots for {sa.get('screenshotDisplayType')} / {la.get('locale')}")

          print("\n=== Subscriptions ===")
          group_refs = try_list_all(f"/apps/{app_id}/relationships/subscriptionGroups?limit=200")
          if group_refs is None:
              print("Falling back to /subscriptionGroups?filter[app]=...")
              group_refs = try_list_all(f"/subscriptionGroups?filter[app]={app_id}&limit=200") or []
          all_subs = []
          for ref in group_refs:
              group = maybe("GET", f"/subscriptionGroups/{ref['id']}")
              if group and group.get("data"):
                  print(f"group id={ref['id']} attrs={group['data'].get('attributes', {})}")
              subs = list_all(f"/subscriptionGroups/{ref['id']}/subscriptions?limit=200")
              all_subs.extend(subs)
          by_pid = {s.get("attributes", {}).get("productId"): s for s in all_subs}
          for pid, expected_name in EXPECTED_PRODUCTS.items():
              sub = by_pid.get(pid)
              if not sub:
                  issue(f"Missing subscription product {pid}")
                  continue
              sid = sub["id"]
              attrs = sub.get("attributes", {})
              print(f"subscription {pid} id={sid} state={attrs.get('state')} name={attrs.get('name')} period={attrs.get('subscriptionPeriod')} groupLevel={attrs.get('groupLevel')}")
              if attrs.get("state") in BLOCKED_SUBSCRIPTION_STATES:
                  issue(f"Subscription {pid} is not ready for review: {attrs.get('state')}")
              if attrs.get("name") != expected_name:
                  warn(f"Subscription {pid} name is {attrs.get('name')}, expected {expected_name}")
              locs = list_all(f"/subscriptions/{sid}/subscriptionLocalizations?limit=20")
              if not any(l.get("attributes", {}).get("locale") == "en-US" for l in locs):
                  issue(f"Subscription {pid} has no en-US localization")
              prices = maybe("GET", f"/subscriptions/{sid}/prices?include=subscriptionPricePoint,territory&filter[territory]=KAZ&limit=20")
              if not prices or not prices.get("data"):
                  warn(f"Subscription {pid} has no visible KAZ price rows from prices endpoint")
              shots = maybe("GET", f"/subscriptionAppStoreReviewScreenshots?filter[subscription]={sid}&limit=20")
              if shots and shots.get("data"):
                  print(f"  review screenshots={len(shots['data'])}")
              else:
                  warn(f"Could not confirm review screenshot for {pid}")

          print("\n=== Review submissions ===")
          review = maybe("GET", f"/reviewSubmissions?filter[app]={app_id}&filter[platform]=IOS&include=items")
          if review:
              subs = review.get("data", [])
              included = {(i["type"], i["id"]): i for i in review.get("included", [])}
              print(f"review submissions={len(subs)}")
              for sub in subs:
                  attrs = sub.get("attributes", {})
                  print(f"submission id={sub['id']} state={attrs.get('state')} submittedDate={attrs.get('submittedDate')}")
                  for item_ref in sub.get("relationships", {}).get("items", {}).get("data", []) or []:
                      item = included.get((item_ref["type"], item_ref["id"]))
                      print(f"  item ref={item_ref} attrs={item.get('attributes', {}) if item else {}}")

          print("\n=== Audit summary ===")
          print(f"issues={len(issues)} warnings={len(warnings)}")
          for msg in issues:
              print(f"ISSUE: {msg}")
          for msg in warnings:
              print(f"WARN: {msg}")
          if issues:
              raise SystemExit(1)
          PY

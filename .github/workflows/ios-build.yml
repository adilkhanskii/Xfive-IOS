name: iOS build & TestFlight upload

permissions:
  contents: read
  statuses: write

on:
  push:
    branches: [main, codex/x5-cleanup-from-restore-clean, codex/x5-client-feedback-20260807]
  workflow_dispatch:
    inputs:
      runner:
        # 08.10: macos-26 (arm64) часами не выдаётся — запасной Intel.
        description: "macOS runner"
        type: choice
        default: macos-26
        options: [macos-26, macos-15, macos-15-intel]

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    environment: app-store-production
    timeout-minutes: 40
    env:
      SCHEME: X5-Course-CI
      BUNDLE_ID: com.x5studio.app
      ARCHIVE_PATH: ${{ github.workspace }}/build/X5.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Restore approved private Home artwork
        env:
          X5_HOME_ART_KEY: ${{ secrets.X5_HOME_ART_KEY }}
        run: scripts/decrypt_client_home_art.sh

      - name: Select Xcode
        run: |
          X=/Applications/Xcode_26.app; [ -d "$X" ] || X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true); sudo xcode-select -s "${X:-/Applications/Xcode.app}"
          xcodebuild -version

      # ── КЕШ: Swift Package Manager + DerivedData ──
      - name: Cache SPM dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Developer/Xcode/DerivedData/**/.build
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Install verified XcodeGen 2.45.4
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            'https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip' \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo '090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  '"$RUNNER_TEMP/xcodegen.zip" \
            | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/xcodegen"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Cache DerivedData (Xcode build artifacts)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('X5/**/*.swift', 'project.yml') }}
          restore-keys: |
            derived-${{ runner.os }}-

      # ── Подготовка проекта (параллельно с кешем выше) ──
      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set up signing keychain
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo -n "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          P12_PASSWORD_CLEAN=$(printf '%s' "$P12_PASSWORD" | tr -d '\r\n')

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD_CLEAN" -f pkcs12 -A -t cert
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<<"$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Installed profile UUID: $UUID"

      - name: Resolve provisioning profile name
        id: profile
        run: |
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<<"$(security cms -D -i "$PROFILE_PATH")")
          echo "Using profile: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Patch ExportOptions.plist with profile name
        run: |
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:${BUNDLE_ID} '${{ steps.profile.outputs.name }}'" ExportOptions.plist

      - name: Write Release.xcconfig with profile name
        run: |
          cat > Release.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = ${{ steps.profile.outputs.name }}
          DEVELOPMENT_TEAM = F8LA8PC4U6
          OTHER_CODE_SIGN_FLAGS = --keychain $RUNNER_TEMP/build.keychain-db
          ENABLE_ON_DEMAND_RESOURCES = NO
          ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS = NO
          EOF

      - name: Build & archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project X5.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_COMPILATION_MODE=wholemodule \
            archive

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Verify exported application excludes test credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts.tests.test_verify_release_bundle
          IPA=$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)
          VERSION=$(sed -n 's/.*MARKETING_VERSION: "\([^"]*\)"/\1/p' project.yml | head -n 1)
          BUILD=$(sed -n 's/.*CURRENT_PROJECT_VERSION: "\([^"]*\)"/\1/p' project.yml | head -n 1)
          python3 scripts/verify_release_bundle.py "$IPA" --version "$VERSION" --build "$BUILD"

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          P8_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$P8_PATH"
          mkdir -p ./private_keys
          cp "$P8_PATH" ./private_keys/

      - name: Upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_APP_ID: "6764340680"
        run: |
          set -euo pipefail
          IPA=$(ls "$EXPORT_PATH"/*.ipa | head -n 1)
          LOG="$RUNNER_TEMP/altool-upload.log"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apple-id "$ASC_APP_ID" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" 2>&1 | tee "$LOG"
          if grep -E "UPLOAD FAILED|Failed to upload package|STATE_ERROR|Validation failed" "$LOG"; then
            exit 1
          fi

      - name: Remove restored private Home artwork
        if: always()
        run: rm -f X5/Assets.xcassets/HomeApprovedReference.imageset/HomeApprovedReference.png

      - name: Publish TestFlight upload status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success)
              STATE="success"
              DESCRIPTION="Build uploaded to TestFlight"
              ;;
            cancelled)
              STATE="error"
              DESCRIPTION="TestFlight upload cancelled"
              ;;
            *)
              STATE="failure"
              DESCRIPTION="TestFlight upload failed"
              ;;
          esac
          TARGET_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data "{\"state\":\"$STATE\",\"target_url\":\"$TARGET_URL\",\"description\":\"$DESCRIPTION\",\"context\":\"testflight/upload\"}"

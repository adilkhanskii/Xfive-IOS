name: ASC state probes

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [codex/x5-cleanup-from-restore-clean]
    paths:
      - ".github/workflows/asc-state-probes.yml"

jobs:
  probe:
    name: ${{ matrix.probe }}
    runs-on: ubuntu-latest
    environment: app-store-production
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        probe:
          - version_in_review
          - version_pending_release
          - version_editable
          - target_build_valid
          - target_build_attached
          - open_review_active
          - open_review_ready
          - open_review_unresolved
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      BUNDLE_ID: com.x5studio.app
      TARGET_VERSION: "1.1.4"
      TARGET_BUILD: "180"
      PROBE: ${{ matrix.probe }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r .github/requirements/asc-requirements.lock
      - name: Probe ASC state
        run: |
          python <<'PY'
          import base64
          import os
          import sys
          import time

          import jwt
          import requests

          BASE = "https://api.appstoreconnect.apple.com/v1"
          EDITABLE = {"PREPARE_FOR_SUBMISSION", "READY_FOR_REVIEW", "DEVELOPER_REJECTED", "REJECTED"}
          ACTIVE = {"WAITING_FOR_REVIEW", "IN_REVIEW", "COMPLETING"}

          token = jwt.encode(
              {
                  "iss": os.environ["ASC_API_ISSUER_ID"],
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 600,
                  "aud": "appstoreconnect-v1",
              },
              base64.b64decode(os.environ["ASC_API_KEY_BASE64"]),
              algorithm="ES256",
              headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"},
          )
          headers = {"Authorization": f"Bearer {token}"}

          def get(path):
              response = requests.get(f"{BASE}{path}", headers=headers, timeout=60)
              if response.status_code >= 300:
                  print(f"GET {path} -> HTTP {response.status_code}")
                  print(response.text[:1000])
                  raise SystemExit(2)
              return response.json()

          def list_all(path):
              rows = []
              url = f"{BASE}{path}"
              while url:
                  response = requests.get(url, headers=headers, timeout=60)
                  if response.status_code >= 300:
                      print(f"GET {url} -> HTTP {response.status_code}")
                      print(response.text[:1000])
                      raise SystemExit(2)
                  payload = response.json()
                  rows.extend(payload.get("data", []))
                  url = payload.get("links", {}).get("next")
              return rows

          app_rows = get(f"/apps?filter[bundleId]={os.environ['BUNDLE_ID']}").get("data", [])
          if not app_rows:
              sys.exit("No app")
          app_id = app_rows[0]["id"]

          version = next(
              (
                  row for row in list_all(f"/apps/{app_id}/appStoreVersions?limit=50")
                  if row.get("attributes", {}).get("versionString") == os.environ["TARGET_VERSION"]
                  and row.get("attributes", {}).get("platform") == "IOS"
              ),
              None,
          )
          state = version.get("attributes", {}).get("appStoreState") if version else None
          version_id = version.get("id") if version else None

          attached = get(f"/appStoreVersions/{version_id}/build").get("data") if version_id else None
          attached_build = attached.get("attributes", {}).get("version") if attached else None

          build = next(
              (
                  row for row in list_all(
                      f"/builds?filter[app]={app_id}&filter[preReleaseVersion.platform]=IOS&limit=200&sort=-uploadedDate"
                  )
                  if row.get("attributes", {}).get("version") == os.environ["TARGET_BUILD"]
              ),
              None,
          )
          build_attrs = build.get("attributes", {}) if build else {}
          build_valid = build_attrs.get("processingState") == "VALID" and not build_attrs.get("expired")

          submissions = get(f"/reviewSubmissions?filter[app]={app_id}&filter[platform]=IOS").get("data", [])
          open_states = [row.get("attributes", {}).get("state") for row in submissions]

          probe = os.environ["PROBE"]
          checks = {
              "version_in_review": state in ACTIVE,
              "version_pending_release": state == "PENDING_DEVELOPER_RELEASE",
              "version_editable": state in EDITABLE,
              "target_build_valid": build_valid,
              "target_build_attached": attached_build == os.environ["TARGET_BUILD"],
              "open_review_active": any(s in ACTIVE for s in open_states),
              "open_review_ready": "READY_FOR_REVIEW" in open_states,
              "open_review_unresolved": "UNRESOLVED_ISSUES" in open_states,
          }

          print(f"version_state={state}")
          print(f"attached_build={attached_build}")
          print(f"build_state={build_attrs.get('processingState')} expired={build_attrs.get('expired')}")
          print(f"open_review_states={open_states}")
          if checks[probe]:
              print(f"PROBE_TRUE {probe}")
              raise SystemExit(0)
          print(f"PROBE_FALSE {probe}")
          raise SystemExit(1)
          PY

name: ASC manage review submissions

permissions:
  contents: read

# Lists / submits / deletes review submissions for the app. fastlane bailed
# with "A review submission is already in progress" — this gives us direct
# control over the ReviewSubmission entity to inspect and finalize it.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        default: "list"
        options:
          - list
          - submit
          - cancel
          - delete_rejected_items
          - cancel_ready

jobs:
  run:
    runs-on: ubuntu-latest
    environment: app-store-production
    timeout-minutes: 5
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      BUNDLE_ID: com.x5studio.app
      ACTION: ${{ inputs.action }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r .github/requirements/asc-requirements.lock
      - name: Submit guarded current X5 release
        if: ${{ inputs.action == 'submit' }}
        run: |
          python scripts/asc_submit_credit_packs.py --action submit
          python scripts/asc_set_after_approval.py
      - name: Manage review submission
        if: ${{ inputs.action != 'submit' }}
        run: |
          python <<'PY'
          import os, base64, time, json, sys
          import jwt, requests

          token = jwt.encode(
              {"iss": os.environ["ASC_API_ISSUER_ID"], "iat": int(time.time()),
               "exp": int(time.time()) + 300, "aud": "appstoreconnect-v1"},
              base64.b64decode(os.environ["ASC_API_KEY_BASE64"]),
              algorithm="ES256",
              headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"},
          )
          h = {"Authorization": f"Bearer {token}"}
          base = "https://api.appstoreconnect.apple.com/v1"
          action = os.environ["ACTION"]

          r = requests.get(f"{base}/apps?filter[bundleId]={os.environ['BUNDLE_ID']}", headers=h)
          r.raise_for_status()
          app_id = r.json()["data"][0]["id"]
          print(f"App: {app_id}")

          # All review submissions for IOS.
          r = requests.get(
              f"{base}/reviewSubmissions",
              headers=h,
              params={
                  "filter[app]": app_id,
                  "filter[platform]": "IOS",
                  "include": "items",
              },
          )
          r.raise_for_status()
          payload = r.json()
          subs = payload.get("data", [])
          included = {(i["type"], i["id"]): i for i in payload.get("included", [])}
          print(f"Review submissions: {len(subs)}")
          for s in subs:
              attr = s["attributes"]
              print(f"  {s['id']}  state={attr.get('state')}  submittedDate={attr.get('submittedDate')}")
              for item_ref in s.get("relationships", {}).get("items", {}).get("data", []) or []:
                  item = included.get((item_ref["type"], item_ref["id"]))
                  if item:
                      print(f"     item: type={item['type']} id={item['id']} attrs={item.get('attributes', {})}")

          if action == "list":
              raise SystemExit(0)

          if action == "delete_rejected_items":
              for s in subs:
                  for item_ref in s.get("relationships", {}).get("items", {}).get("data", []) or []:
                      item = included.get((item_ref["type"], item_ref["id"]))
                      if item and item.get("attributes", {}).get("state") == "REJECTED":
                          iid = item["id"]
                          rd = requests.delete(f"{base}/reviewSubmissionItems/{iid}", headers=h)
                          print(f"DELETE item {iid} HTTP {rd.status_code}: {rd.text[:200]}")
              raise SystemExit(0)

          if action == "cancel_ready":
              for s in subs:
                  if s["attributes"].get("state") == "READY_FOR_REVIEW":
                      sid = s["id"]
                      rd = requests.delete(f"{base}/reviewSubmissions/{sid}", headers=h)
                      print(f"DELETE READY submission {sid} HTTP {rd.status_code}: {rd.text[:200]}")
              raise SystemExit(0)

          # Find the open one.
          target = None
          for s in subs:
              state = s["attributes"].get("state")
              if state in ("READY_FOR_REVIEW", "WAITING_FOR_REVIEW"):
                  continue
              if state in ("COMPLETING", "IN_REVIEW", "UNRESOLVED_ISSUES", "COMPLETE"):
                  continue
              target = s
              break

          if target is None:
              # Try the first non-completed one.
              for s in subs:
                  if s["attributes"].get("state") != "COMPLETE":
                      target = s
                      break

          if not target:
              sys.exit("No open submission found")

          tid = target["id"]
          state = target["attributes"]["state"]
          print(f"\nTarget: {tid}  state={state}")

          if action == "submit":
              # App Store Connect now requires the appStoreVersionForReview
              # relationship on the ReviewSubmission itself. Older workflows
              # that only created reviewSubmissionItems leave READY_FOR_REVIEW
              # submissions empty and PATCH submitted=true fails with:
              # "appStoreVersionForReview relationship required".
              r = requests.get(f"{base}/apps/{app_id}/appStoreVersions", headers=h)
              r.raise_for_status()
              version_id = next(
                  (v["id"] for v in r.json()["data"]
                   if v["attributes"].get("versionString") == "1.1.0"
                   and v["attributes"].get("platform") == "IOS"),
                  None,
              )
              if not version_id:
                  sys.exit("No iOS appStoreVersion 1.1.0 found")
              submit_payload = {"data": {
                  "type": "reviewSubmissions",
                  "id": tid,
                  "attributes": {"submitted": True},
                  "relationships": {
                      "appStoreVersionForReview": {
                          "data": {"type": "appStoreVersions", "id": version_id}
                      }
                  },
              }}
              if state == "READY_FOR_REVIEW":
                  print("Submitting (state -> WAITING_FOR_REVIEW)...")
                  r = requests.patch(
                      f"{base}/reviewSubmissions/{tid}",
                      headers={**h, "Content-Type": "application/json"},
                      json=submit_payload,
                  )
                  if r.status_code >= 300:
                      print(f"HTTP {r.status_code}: {r.text}")
                      sys.exit(1)
                  print("Submitted.")
              else:
                  print(f"State {state} - attempting submit anyway...")
                  r = requests.patch(
                      f"{base}/reviewSubmissions/{tid}",
                      headers={**h, "Content-Type": "application/json"},
                      json=submit_payload,
                  )
                  print(f"HTTP {r.status_code}: {r.text[:300]}")

          elif action == "cancel":
              print(f"Cancelling submission {tid}...")
              r = requests.patch(
                  f"{base}/reviewSubmissions/{tid}",
                  headers={**h, "Content-Type": "application/json"},
                  json={"data": {
                      "type": "reviewSubmissions",
                      "id": tid,
                      "attributes": {"canceled": True},
                  }},
              )
              if r.status_code >= 300:
                  print(f"HTTP {r.status_code}: {r.text}")
                  sys.exit(1)
              print("Cancelled.")

          # Re-list.
          r = requests.get(
              f"{base}/reviewSubmissions",
              headers=h,
              params={"filter[app]": app_id, "filter[platform]": "IOS"},
          )
          for s in r.json().get("data", []):
              print(f"  {s['id']}  state={s['attributes'].get('state')}")
          PY

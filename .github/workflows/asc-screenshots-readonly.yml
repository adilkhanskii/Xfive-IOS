name: ASC screenshots read-only check

# Только чтение (GET): сколько скринов в каждой локализации версии и какая
# сборка привязана. Ничего в App Store Connect не меняет.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [release/ios]
    paths:
      - ".github/workflows/asc-screenshots-readonly.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    environment: app-store-production
    timeout-minutes: 5
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      BUNDLE_ID: com.x5studio.app
      VERSION: "1.1.21"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r .github/requirements/asc-requirements.lock
      - name: Read version, build and screenshots
        run: |
          python <<'PY'
          import base64, os, time
          import jwt, requests
          BASE = "https://api.appstoreconnect.apple.com/v1"
          token = jwt.encode(
              {"iss": os.environ["ASC_API_ISSUER_ID"], "iat": int(time.time()),
               "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              base64.b64decode(os.environ["ASC_API_KEY_BASE64"]), algorithm="ES256",
              headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"})
          h = {"Authorization": f"Bearer {token}"}
          def get(path):
              r = requests.get(path if path.startswith("http") else BASE + path, headers=h, timeout=60)
              r.raise_for_status()
              return r.json()
          app_id = get(f"/apps?filter[bundleId]={os.environ['BUNDLE_ID']}")["data"][0]["id"]
          versions = get(f"/apps/{app_id}/appStoreVersions?filter[platform]=IOS&limit=20")["data"]
          v = next(x for x in versions if x["attributes"]["versionString"] == os.environ["VERSION"])
          print(f"Version {os.environ['VERSION']}: state={v['attributes'].get('appStoreState')} release={v['attributes'].get('releaseType')}")
          build = get(f"/appStoreVersions/{v['id']}/build").get("data")
          print(f"Attached build: {build['attributes']['version'] if build else None} state={build['attributes'].get('processingState') if build else None}")
          for loc in get(f"/appStoreVersions/{v['id']}/appStoreVersionLocalizations")["data"]:
              locale = loc["attributes"]["locale"]
              sets = get(f"/appStoreVersionLocalizations/{loc['id']}/appScreenshotSets")["data"]
              if not sets:
                  print(f"{locale}: no screenshot sets")
              for s in sets:
                  shots = get(f"/appScreenshotSets/{s['id']}/appScreenshots?limit=50")["data"]
                  states = [x["attributes"].get("assetDeliveryState", {}).get("state") for x in shots]
                  names = [x["attributes"].get("fileName") for x in shots]
                  print(f"{locale} {s['attributes']['screenshotDisplayType']}: {len(shots)} screenshots states={states}")
                  print(f"   files={names}")
          PY

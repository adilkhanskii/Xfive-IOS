name: ASC check TestFlight status

permissions:
  contents: read

# Inspect TestFlight beta state for builds — internal testers, beta groups,
# export compliance, build availability. Diagnoses why a build isn't
# showing up for testers despite state=VALID.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number to inspect"
        required: true
        default: "251"
      action:
        description: "Read only, or guarded assignment to internal groups 123 and 321"
        required: true
        type: choice
        default: "inspect"
        options:
          - inspect
          - assign_internal_groups

jobs:
  status:
    runs-on: ubuntu-latest
    environment: app-store-production
    timeout-minutes: 15
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      BUNDLE_ID: com.x5studio.app
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r .github/requirements/asc-requirements.lock
      - name: Assign build to approved internal groups
        if: ${{ inputs.action == 'assign_internal_groups' }}
        run: |
          python scripts/asc_assign_testflight_groups.py \
            --build "$BUILD_NUMBER" \
            --group "123" \
            --group "321"
      - name: Check TF status
        run: |
          python <<'PY'
          import os, base64, time, json, sys
          import jwt, requests

          token = jwt.encode(
              {"iss": os.environ["ASC_API_ISSUER_ID"], "iat": int(time.time()),
               "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              base64.b64decode(os.environ["ASC_API_KEY_BASE64"]),
              algorithm="ES256",
              headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"},
          )
          h = {"Authorization": f"Bearer {token}"}
          base = "https://api.appstoreconnect.apple.com/v1"

          r = requests.get(f"{base}/apps?filter[bundleId]={os.environ['BUNDLE_ID']}", headers=h)
          app_id = r.json()["data"][0]["id"]
          print(f"App: {app_id}")

          want = os.environ["BUILD_NUMBER"]

          # 1. Get build (no includes — some are forbidden by API)
          r = requests.get(
              f"{base}/builds",
              headers=h,
              params={
                  "filter[app]": app_id,
                  "filter[preReleaseVersion.platform]": "IOS",
                  "limit": 200,
                  "sort": "-uploadedDate",
              },
          )
          r.raise_for_status()
          payload = r.json()
          included = {}

          build = next((b for b in payload["data"]
                       if b["attributes"]["version"] == want), None)
          if not build:
              sys.exit(f"Build {want} not found")

          attrs = build["attributes"]
          print(f"\n=== Build {want} ===")
          print(f"  id: {build['id']}")
          for k in ["processingState", "uploadedDate", "expired", "minOsVersion",
                    "buildAudienceType", "iconAssetToken", "version"]:
              print(f"  {k}: {attrs.get(k)}")

          # 2. Buildy beta detail (export compliance, internal/external state)
          rels = build.get("relationships", {})
          print(f"\n=== buildBetaDetail ===")
          bbd_ref = rels.get("buildBetaDetail", {}).get("data")
          if bbd_ref:
              bbd = included.get((bbd_ref["type"], bbd_ref["id"]))
              if bbd:
                  for k, v in bbd.get("attributes", {}).items():
                      print(f"  {k}: {v}")
          else:
              print("  (no buildBetaDetail relationship)")

          # 3. Direct fetch buildBetaDetail
          rb = requests.get(f"{base}/builds/{build['id']}/buildBetaDetail", headers=h)
          if rb.status_code == 200:
              bd = rb.json().get("data")
              if bd:
                  print(f"\n=== buildBetaDetail (direct) ===")
                  for k, v in bd.get("attributes", {}).items():
                      print(f"  {k}: {v}")

          # 4. Beta groups assigned to this build
          rg = requests.get(f"{base}/builds/{build['id']}/individualTesters", headers=h)
          if rg.status_code == 200:
              testers = rg.json().get("data", [])
              print(f"\n=== Individual testers on build: {len(testers)} ===")

          # 5. App-level beta groups
          rb = requests.get(f"{base}/apps/{app_id}/betaGroups?limit=20", headers=h)
          if rb.status_code == 200:
              groups = rb.json().get("data", [])
              print(f"\n=== Beta groups on app: {len(groups)} ===")
              for g in groups:
                  ga = g.get("attributes", {})
                  print(f"  {g['id']}  name={ga.get('name')}  isInternal={ga.get('isInternalGroup')}  publicLink={ga.get('publicLinkEnabled')}")
                  # List builds in this group
                  rgb = requests.get(f"{base}/betaGroups/{g['id']}/builds?limit=5&sort=-uploadedDate", headers=h)
                  if rgb.status_code == 200:
                      gbuilds = rgb.json().get("data", [])
                      for gb in gbuilds[:3]:
                          ga2 = gb.get("attributes", {})
                          print(f"    - build {ga2.get('version')} state={ga2.get('processingState')}")

          # 6. External-testing prerequisites. Only completeness flags are
          # printed; contact/demo values remain private.
          rl = requests.get(
              f"{base}/apps/{app_id}/betaAppLocalizations?limit=50", headers=h
          )
          print(f"\n=== betaAppLocalizations HTTP {rl.status_code} ===")
          if rl.status_code == 200:
              for loc in rl.json().get("data", []):
                  la = loc.get("attributes", {})
                  print(
                      f"  locale={la.get('locale')} "
                      f"description_present={bool(str(la.get('description') or '').strip())}"
                  )

          rr = requests.get(f"{base}/apps/{app_id}/betaAppReviewDetail", headers=h)
          print(f"\n=== betaAppReviewDetail HTTP {rr.status_code} ===")
          if rr.status_code == 200 and rr.json().get("data"):
              ra = rr.json()["data"].get("attributes", {})
              required = ["contactFirstName", "contactLastName", "contactPhone", "contactEmail"]
              print(f"  contact_complete={all(bool(str(ra.get(k) or '').strip()) for k in required)}")
              print(f"  notes_present={bool(str(ra.get('notes') or '').strip())}")

          rs = requests.get(
              f"{base}/betaAppReviewSubmissions",
              headers=h,
              params={"filter[build]": build["id"], "limit": 20},
          )
          print(f"\n=== betaAppReviewSubmissions HTTP {rs.status_code} ===")
          if rs.status_code == 200:
              submissions = rs.json().get("data", [])
              print(f"  count={len(submissions)}")
              for submission in submissions:
                  print(f"  state={submission.get('attributes', {}).get('betaReviewState')}")
          PY

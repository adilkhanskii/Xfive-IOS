name: ASC unblock pending release and submit latest

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [codex/x5-cleanup-from-restore-clean]
    paths:
      - ".github/workflows/asc-unblock-and-submit-latest.yml"
      - "project.yml"
      - "fastlane/**"

jobs:
  unblock-submit:
    runs-on: macos-26
    environment: app-store-production
    timeout-minutes: 120
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      X5_APP_REVIEW_EMAIL: ${{ secrets.X5_APP_REVIEW_EMAIL }}
      X5_APP_REVIEW_PASSWORD: ${{ secrets.X5_APP_REVIEW_PASSWORD }}
      BUNDLE_ID: com.x5studio.app
      PREVIOUS_VERSION: "1.1.3"
      TARGET_VERSION: "1.1.4"
      TARGET_BUILD: "180"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check protected review login before any Apple mutation
        run: python3 scripts/review_test_credentials.py --check

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3.12"
          bundler-cache: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - run: python -m pip install --require-hashes -r .github/requirements/asc-requirements.lock

      - name: Release previous pending App Store version if it blocks edits
        run: |
          python <<'PY'
          import base64
          import json
          import os
          import sys
          import time

          import jwt
          import requests

          BASE = "https://api.appstoreconnect.apple.com/v1"

          token = jwt.encode(
              {
                  "iss": os.environ["ASC_API_ISSUER_ID"],
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 900,
                  "aud": "appstoreconnect-v1",
              },
              base64.b64decode(os.environ["ASC_API_KEY_BASE64"]),
              algorithm="ES256",
              headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"},
          )
          headers = {"Authorization": f"Bearer {token}"}
          json_headers = {**headers, "Content-Type": "application/json"}

          def api(method, path, expected=(200,), **kwargs):
              response = requests.request(
                  method,
                  path if path.startswith("http") else f"{BASE}{path}",
                  headers=headers,
                  timeout=60,
                  **kwargs,
              )
              if response.status_code not in expected:
                  print(f"{method} {path} -> HTTP {response.status_code}")
                  print(response.text[:3000])
                  raise SystemExit(1)
              return response.json() if response.text else {}

          def json_api(method, path, payload, expected=(200,)):
              response = requests.request(
                  method,
                  path if path.startswith("http") else f"{BASE}{path}",
                  headers=json_headers,
                  json=payload,
                  timeout=60,
              )
              if response.status_code not in expected:
                  print(f"{method} {path} -> HTTP {response.status_code}")
                  print(response.text[:3000])
                  raise SystemExit(1)
              return response.json() if response.text else {}

          app_rows = api("GET", f"/apps?filter[bundleId]={os.environ['BUNDLE_ID']}").get("data", [])
          if not app_rows:
              sys.exit(f"No ASC app found for {os.environ['BUNDLE_ID']}")
          app_id = app_rows[0]["id"]
          print(f"App: {app_id}")

          versions = api("GET", f"/apps/{app_id}/appStoreVersions?limit=50").get("data", [])
          previous = next(
              (
                  row for row in versions
                  if row.get("attributes", {}).get("versionString") == os.environ["PREVIOUS_VERSION"]
                  and row.get("attributes", {}).get("platform") == "IOS"
              ),
              None,
          )
          if not previous:
              print(f"Previous version {os.environ['PREVIOUS_VERSION']} is absent; nothing to release.")
              raise SystemExit(0)

          attrs = previous.get("attributes", {})
          version_id = previous["id"]
          state = attrs.get("appStoreState")
          print(f"Previous version {os.environ['PREVIOUS_VERSION']}: {version_id} state={state}")

          build = api("GET", f"/appStoreVersions/{version_id}/build").get("data")
          if build:
              build_attrs = build.get("attributes", {})
              print(
                  "Attached previous build: "
                  f"id={build['id']} version={build_attrs.get('version')} "
                  f"state={build_attrs.get('processingState')} expired={build_attrs.get('expired')}"
              )

          if state == "PENDING_DEVELOPER_RELEASE":
              payload = {
                  "data": {
                      "type": "appStoreVersionReleaseRequests",
                      "relationships": {
                          "appStoreVersion": {
                              "data": {"type": "appStoreVersions", "id": version_id}
                          }
                      },
                  }
              }
              created = json_api("POST", "/appStoreVersionReleaseRequests", payload, expected=(201,))
              print(f"Release request created: {created['data']['id']}")
          else:
              print("Previous version is not pending developer release; skipping release request.")
          PY

      - name: Create target App Store version when ASC allows it
        run: |
          python <<'PY'
          import base64
          import json
          import os
          import sys
          import time

          import jwt
          import requests

          BASE = "https://api.appstoreconnect.apple.com/v1"
          token = jwt.encode(
              {
                  "iss": os.environ["ASC_API_ISSUER_ID"],
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 900,
                  "aud": "appstoreconnect-v1",
              },
              base64.b64decode(os.environ["ASC_API_KEY_BASE64"]),
              algorithm="ES256",
              headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"},
          )
          headers = {"Authorization": f"Bearer {token}"}
          json_headers = {**headers, "Content-Type": "application/json"}

          def request(method, path, expected=(200,), **kwargs):
              url = path if path.startswith("http") else f"{BASE}{path}"
              response = requests.request(method, url, headers=headers, timeout=60, **kwargs)
              if response.status_code not in expected:
                  return response
              return response

          app_response = request("GET", f"/apps?filter[bundleId]={os.environ['BUNDLE_ID']}")
          if app_response.status_code >= 300:
              print(app_response.text[:3000])
              raise SystemExit(1)
          app_id = app_response.json()["data"][0]["id"]
          print(f"App: {app_id}")

          target = os.environ["TARGET_VERSION"]
          for attempt in range(1, 91):
              versions_response = request("GET", f"/apps/{app_id}/appStoreVersions?limit=50")
              if versions_response.status_code >= 300:
                  print(versions_response.text[:3000])
                  raise SystemExit(1)
              versions = versions_response.json().get("data", [])
              existing = next(
                  (
                      row for row in versions
                      if row.get("attributes", {}).get("versionString") == target
                      and row.get("attributes", {}).get("platform") == "IOS"
                  ),
                  None,
              )
              if existing:
                  print(
                      f"Target version {target} exists: {existing['id']} "
                      f"state={existing.get('attributes', {}).get('appStoreState')}"
                  )
                  break

              payload = {
                  "data": {
                      "type": "appStoreVersions",
                      "attributes": {"platform": "IOS", "versionString": target},
                      "relationships": {"app": {"data": {"type": "apps", "id": app_id}}},
                  }
              }
              create_response = requests.post(
                  f"{BASE}/appStoreVersions",
                  headers=json_headers,
                  json=payload,
                  timeout=60,
              )
              if create_response.status_code == 201:
                  created = create_response.json()["data"]
                  print(f"Created target version {target}: {created['id']}")
                  break

              print(f"Create target version attempt {attempt}/90 -> HTTP {create_response.status_code}")
              print(create_response.text[:1000])
              time.sleep(60)
          else:
              sys.exit(f"ASC did not allow creating version {target} within timeout")
          PY

      - name: Upload App Store metadata for target version
        run: bundle exec fastlane ios upload

      - name: Attach target build and submit for review
        run: |
          python <<'PY'
          import base64
          import json
          import os
          import sys
          import time

          import jwt
          import requests

          BASE = "https://api.appstoreconnect.apple.com/v1"
          READY_TO_SUBMIT = {
              "PREPARE_FOR_SUBMISSION",
              "READY_FOR_REVIEW",
              "DEVELOPER_REJECTED",
              "REJECTED",
              "METADATA_REJECTED",
          }

          token = jwt.encode(
              {
                  "iss": os.environ["ASC_API_ISSUER_ID"],
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 900,
                  "aud": "appstoreconnect-v1",
              },
              base64.b64decode(os.environ["ASC_API_KEY_BASE64"]),
              algorithm="ES256",
              headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"},
          )
          headers = {"Authorization": f"Bearer {token}"}
          json_headers = {**headers, "Content-Type": "application/json"}

          def api(method, path, expected=(200,), **kwargs):
              url = path if path.startswith("http") else f"{BASE}{path}"
              response = requests.request(method, url, headers=headers, timeout=60, **kwargs)
              if response.status_code not in expected:
                  print(f"{method} {url} -> HTTP {response.status_code}")
                  print(response.text[:3000])
                  raise SystemExit(1)
              return response.json() if response.text else {}

          def json_api(method, path, payload, expected=(200,)):
              url = path if path.startswith("http") else f"{BASE}{path}"
              response = requests.request(method, url, headers=json_headers, json=payload, timeout=60)
              if response.status_code not in expected:
                  print(f"{method} {url} -> HTTP {response.status_code}")
                  print(response.text[:3000])
                  raise SystemExit(1)
              return response.json() if response.text else {}

          def list_all(path):
              rows = []
              url = f"{BASE}{path}"
              while url:
                  response = requests.get(url, headers=headers, timeout=60)
                  if response.status_code >= 300:
                      print(f"GET {url} -> HTTP {response.status_code}")
                      print(response.text[:3000])
                      raise SystemExit(1)
                  payload = response.json()
                  rows.extend(payload.get("data", []))
                  url = payload.get("links", {}).get("next")
              return rows

          app_rows = api("GET", f"/apps?filter[bundleId]={os.environ['BUNDLE_ID']}").get("data", [])
          if not app_rows:
              sys.exit(f"No ASC app found for {os.environ['BUNDLE_ID']}")
          app_id = app_rows[0]["id"]
          print(f"App: {app_id}")

          versions = list_all(f"/apps/{app_id}/appStoreVersions?limit=50")
          version = next(
              (
                  row for row in versions
                  if row.get("attributes", {}).get("versionString") == os.environ["TARGET_VERSION"]
                  and row.get("attributes", {}).get("platform") == "IOS"
              ),
              None,
          )
          if not version:
              sys.exit(f"No iOS AppStoreVersion {os.environ['TARGET_VERSION']}")
          version_id = version["id"]
          version_state = version["attributes"].get("appStoreState")
          print(f"Target version {os.environ['TARGET_VERSION']}: {version_id} state={version_state}")
          if version_state not in READY_TO_SUBMIT:
              sys.exit(f"Target version is not submittable: {version_state}")

          build = None
          for attempt in range(1, 121):
              builds = list_all(
                  f"/builds?filter[app]={app_id}&filter[preReleaseVersion.platform]=IOS"
                  "&limit=200&sort=-uploadedDate"
              )
              build = next(
                  (
                      row for row in builds
                      if row.get("attributes", {}).get("version") == os.environ["TARGET_BUILD"]
                  ),
                  None,
              )
              if build:
                  attrs = build.get("attributes", {})
                  print(
                      f"Build {os.environ['TARGET_BUILD']}: id={build['id']} "
                      f"state={attrs.get('processingState')} expired={attrs.get('expired')}"
                  )
                  if attrs.get("processingState") == "VALID" and not attrs.get("expired"):
                      break
              print(f"Build {os.environ['TARGET_BUILD']} is not VALID yet; wait attempt {attempt}/120")
              time.sleep(30)
          else:
              sys.exit(f"Build {os.environ['TARGET_BUILD']} is not VALID in App Store Connect")

          json_api(
              "PATCH",
              f"/appStoreVersions/{version_id}/relationships/build",
              {"data": {"type": "builds", "id": build["id"]}},
              expected=(200, 204),
          )
          print(f"Attached build {os.environ['TARGET_BUILD']} to version {os.environ['TARGET_VERSION']}.")

          attached = api("GET", f"/appStoreVersions/{version_id}/build").get("data")
          if not attached:
              sys.exit("No build attached after PATCH")
          attached_attrs = attached.get("attributes", {})
          print(
              f"Attached verification: build={attached_attrs.get('version')} "
              f"state={attached_attrs.get('processingState')}"
          )
          if attached_attrs.get("version") != os.environ["TARGET_BUILD"]:
              sys.exit(f"Wrong build attached: {attached_attrs.get('version')}")

          review_payload = api(
              "GET",
              f"/reviewSubmissions?filter[app]={app_id}&filter[platform]=IOS&include=items",
          )
          submissions = review_payload.get("data", [])
          open_rows = [
              row for row in submissions
              if row.get("attributes", {}).get("state") in {
                  "READY_FOR_REVIEW",
                  "WAITING_FOR_REVIEW",
                  "IN_REVIEW",
                  "COMPLETING",
                  "UNRESOLVED_ISSUES",
              }
          ]
          if open_rows:
              for row in open_rows:
                  print(f"Open review submission: {row['id']} state={row.get('attributes', {}).get('state')}")
              sys.exit("Open review submission exists; refusing to create duplicate")

          created = json_api(
              "POST",
              "/reviewSubmissions",
              {
                  "data": {
                      "type": "reviewSubmissions",
                      "attributes": {"platform": "IOS"},
                      "relationships": {"app": {"data": {"type": "apps", "id": app_id}}},
                  }
              },
              expected=(201,),
          )
          submission_id = created["data"]["id"]
          print(f"Created ReviewSubmission: {submission_id}")

          json_api(
              "POST",
              "/reviewSubmissionItems",
              {
                  "data": {
                      "type": "reviewSubmissionItems",
                      "relationships": {
                          "reviewSubmission": {"data": {"type": "reviewSubmissions", "id": submission_id}},
                          "appStoreVersion": {"data": {"type": "appStoreVersions", "id": version_id}},
                      },
                  }
              },
              expected=(201,),
          )
          print("Attached app version item.")

          submitted = json_api(
              "PATCH",
              f"/reviewSubmissions/{submission_id}",
              {
                  "data": {
                      "type": "reviewSubmissions",
                      "id": submission_id,
                      "attributes": {"submitted": True},
                  }
              },
          )
          final_state = submitted["data"]["attributes"].get("state")
          print(f"Submitted ReviewSubmission: {submission_id} state={final_state}")
          if final_state not in {"WAITING_FOR_REVIEW", "IN_REVIEW"}:
              sys.exit(f"Unexpected final submission state: {final_state}")
          PY
